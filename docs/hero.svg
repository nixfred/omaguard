<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">OmaGuard — a shield in your Omarchy bar</title>
  <desc id="d">A dark bar with a glowing shield widget, four shield states, and a timeline of captures drifting from an accepted reference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141b27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3a8"/>
      <stop offset="0.62" stop-color="#e3b75f"/>
      <stop offset="1" stop-color="#e06c6c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Omarchy chamfer frame -->
  <path d="M28 20H1172L1180 28V392L1172 400H28L20 392V28Z" fill="none" stroke="#7dd3a8" stroke-opacity="0.25"/>

  <!-- The bar -->
  <path d="M60 52H1140L1148 60V96L1140 104H60L52 96V60Z" fill="#0e131c" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#8b94a7">
    <rect x="76" y="66" width="24" height="24" rx="4" fill="none" stroke="#8b94a7" stroke-opacity="0.7"/>
    <circle cx="128" cy="78" r="13" fill="#5b8def" fill-opacity="0.85"/>
    <text x="123" y="84" fill="#0b0f17" font-weight="700">1</text>
    <path d="M160 72h10l4-5 4 5h8v8l-4 4 4 4v6h-26z" fill="none" stroke="#8b94a7" stroke-width="1.6"/>
  </g>
  <!-- OmaGuard in the bar -->
  <circle cx="226" cy="78" r="36" fill="url(#glow)"/>
  <path d="M226 60l15 6v11c0 10-6.5 17-15 21-8.5-4-15-11-15-21V66z" fill="#7dd3a8" fill-opacity="0.18" stroke="#7dd3a8" stroke-width="2"/>
  <path d="M218 78l6 6 11-12" fill="none" stroke="#7dd3a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#8b94a7" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <path d="M276 70l10 8-10 8M286 62v32l8-8-8-8"/>
    <rect x="1040" y="68" width="34" height="18" rx="3"/><rect x="1074" y="73" width="3" height="8"/>
    <path d="M1100 70h30M1100 78h22M1100 86h26"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.06">
    <rect x="330" y="70" width="170" height="16" rx="3"/>
    <rect x="520" y="70" width="240" height="16" rx="3"/>
    <rect x="780" y="70" width="120" height="16" rx="3"/>
  </g>
  <path d="M226 104v34" stroke="#7dd3a8" stroke-opacity="0.45" stroke-dasharray="3 4"/>

  <!-- Wordmark -->
  <g font-family="JetBrains Mono, monospace">
    <text x="60" y="196" font-size="64" font-weight="800" fill="#e8ecf3" letter-spacing="6">OMAGUARD</text>
    <text x="62" y="232" font-size="18" fill="#8b94a7">keep my Omarchy mine</text>
    <text x="62" y="268" font-size="14" fill="#6b7386">config timeline · drift detection · bar profiles · preview-only restore</text>
  </g>

  <!-- Four states -->
  <g font-family="JetBrains Mono, monospace" font-size="13">
    <g transform="translate(62 300)">
      <path d="M14 0l14 5.5v10C28 25 22 31 14 35 6 31 0 25 0 15.5v-10z" fill="#7dd3a8" fill-opacity="0.2" stroke="#7dd3a8" stroke-width="1.8"/>
      <path d="M8 17l5 5 9-10" fill="none" stroke="#7dd3a8" stroke-width="2.2" stroke-linecap="round"/>
      <text x="40" y="23" fill="#7dd3a8">holding</text>
    </g>
    <g transform="translate(212 300)">
      <path d="M14 0l14 5.5v10C28 25 22 31 14 35 6 31 0 25 0 15.5v-10z" fill="#e3b75f" fill-opacity="0.2" stroke="#e3b75f" stroke-width="1.8"/>
      <path d="M14 9v11M14 25v1" stroke="#e3b75f" stroke-width="2.4" stroke-linecap="round"/>
      <text x="40" y="23" fill="#e3b75f">drift</text>
    </g>
    <g transform="translate(342 300)">
      <path d="M14 0l14 5.5v10C28 25 22 31 14 35 6 31 0 25 0 15.5v-10z" fill="#e06c6c" fill-opacity="0.2" stroke="#e06c6c" stroke-width="1.8"/>
      <path d="M8 11l12 12M20 11L8 23" stroke="#e06c6c" stroke-width="2.2" stroke-linecap="round"/>
      <text x="40" y="23" fill="#e06c6c">broken</text>
    </g>
    <g transform="translate(482 300)">
      <path d="M14 0l14 5.5v10C28 25 22 31 14 35 6 31 0 25 0 15.5v-10z" fill="none" stroke="#6b7386" stroke-width="1.8"/>
      <path d="M14 0v35" stroke="#6b7386" stroke-width="1.8"/>
      <path d="M14 0l14 5.5v10C28 25 22 31 14 35z" fill="#6b7386" fill-opacity="0.3"/>
      <text x="40" y="23" fill="#8b94a7">unknown</text>
    </g>
  </g>

  <!-- Timeline -->
  <g transform="translate(700 150)" font-family="JetBrains Mono, monospace" font-size="12">
    <text x="0" y="0" fill="#6b7386" letter-spacing="2">TIMELINE</text>
    <path d="M10 40H440" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <g>
      <circle cx="20" cy="40" r="10" fill="#0b0f17" stroke="#7dd3a8" stroke-width="3"/>
      <circle cx="20" cy="40" r="4" fill="#7dd3a8"/>
      <text x="0" y="74" fill="#7dd3a8">reference</text>
      <text x="0" y="92" fill="#6b7386">you accepted</text>
    </g>
    <circle cx="130" cy="40" r="7" fill="#0b0f17" stroke="#7dd3a8" stroke-width="2.5"/>
    <text x="112" y="74" fill="#6b7386">same</text>
    <circle cx="240" cy="40" r="7" fill="#0b0f17" stroke="#b9c27a" stroke-width="2.5"/>
    <text x="214" y="74" fill="#b9c27a">idle.lock</text>
    <circle cx="340" cy="40" r="8" fill="#0b0f17" stroke="#e3b75f" stroke-width="2.5"/>
    <text x="318" y="74" fill="#e3b75f">bar moved</text>
    <circle cx="420" cy="40" r="9" fill="#0b0f17" stroke="#e06c6c" stroke-width="3"/>
    <text x="376" y="92" fill="#e06c6c">Ctrl+V gone</text>

    <!-- Preview card -->
    <path d="M8 118H432L440 126V222L432 230H8L0 222V126Z" fill="#0e131c" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="142" fill="#e8ecf3" font-weight="700">PREVIEW ONLY — nothing was written</text>
    <text x="18" y="168" fill="#e06c6c">- "seconds": false</text>
    <text x="18" y="188" fill="#7dd3a8">+ "seconds": true</text>
    <text x="18" y="214" fill="#6b7386">idle.lock: 900 kept · hash 3f9a1c…</text>
  </g>

  <!-- Profile chips -->
  <g transform="translate(700 400)" font-family="JetBrains Mono, monospace" font-size="12">
  </g>
  <g transform="translate(700 36)" font-family="JetBrains Mono, monospace" font-size="12" opacity="0">
  </g>
</svg>
